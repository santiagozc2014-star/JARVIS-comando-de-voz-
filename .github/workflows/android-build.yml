name: Build JARVIS Android APK

on:
  push:
    branches:
      - jarvis/rebuild-android-project
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_SIGNING_CONFIGURED: ${{ secrets.JARVIS_KEYSTORE_BASE64 != '' && secrets.JARVIS_KEYSTORE_PASSWORD != '' && secrets.JARVIS_KEY_ALIAS != '' && secrets.JARVIS_KEY_PASSWORD != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"
      - name: Run Android lint
        run: gradle :app:lintDebug
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Run conversation unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Verify APK signature
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" app/build/outputs/apk/debug/app-debug.apk.signature.txt
          grep -Eq "V2 Signer: certificate SHA-256 digest: [[:xdigit:]]{64}" app/build/outputs/apk/debug/app-debug.apk.signature.txt
      - name: Generate APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Prepare protected release signing key
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        env:
          JARVIS_KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/jarvis-release.jks"
          umask 077
          printf '%s' "$JARVIS_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "JARVIS_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        env:
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Verify signed release APK
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$APK.signature.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$APK.signature.txt"
          grep -Eq "V2 Signer: certificate SHA-256 digest: [[:xdigit:]]{64}" "$APK.signature.txt"
          sha256sum "$APK" > "$APK.sha256"
      - name: Upload signed release APK
        if: ${{ env.RELEASE_SIGNING_CONFIGURED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: JARVISWakeWord-signed-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            app/build/outputs/apk/release/app-release.apk.signature.txt
          if-no-files-found: error
      - name: Remove temporary release signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/jarvis-release.jks"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVISWakeWord-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/app-debug.apk.signature.txt
          if-no-files-found: error
