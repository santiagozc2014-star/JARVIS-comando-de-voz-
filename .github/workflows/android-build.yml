name: Build JARVIS Android APK

on:
  push:
    branches:
      - jarvis/rebuild-android-project
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"
      - name: Run Android lint
        run: gradle :app:lintDebug
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Run conversation unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Verify APK signature
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.signature.txt
          grep -q "Signer #1 certificate SHA-256 digest:" app/build/outputs/apk/debug/app-debug.apk.signature.txt
      - name: Generate APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVISWakeWord-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/app-debug.apk.signature.txt
          if-no-files-found: error
