<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111d">
  <meta name="description" content="Panel diario personal JARVIS DAILY: estudio, higiene, actividad, responsabilidades y descanso.">
  <title>JARVIS DAILY</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <style>
    :root{color-scheme:dark;--bg:#07111d;--panel:#101d2c;--panel2:#142538;--line:#26394d;--text:#edf6ff;--muted:#9bb0c4;--accent:#57d7d0;--accent2:#83a8ff;--good:#6fe0a5}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#143047 0,transparent 42%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
    .wrap{max-width:760px;margin:0 auto;padding:22px 16px calc(32px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;gap:14px;margin:8px 0 20px}.mark{width:54px;height:54px;flex:none;border:1px solid #3a8f9a;border-radius:17px;background:linear-gradient(145deg,#15394b,#0d1b2a);display:grid;place-items:center;color:var(--accent);font-size:27px;font-weight:800;box-shadow:0 0 28px #45d8d022}
    h1{font-size:23px;letter-spacing:.12em;margin:0}.sub{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.date{margin-left:auto;text-align:right;color:var(--muted);font-size:12px}
    .panel{background:linear-gradient(160deg,#132538,#0e1b2a);border:1px solid var(--line);border-radius:20px;padding:17px;margin:14px 0;box-shadow:0 12px 36px #0003}
    .overview{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}.overlabel{font-size:14px;color:var(--muted)}.percent{font-size:30px;font-weight:750;color:var(--accent);font-variant-numeric:tabular-nums}.track{height:9px;background:#23384b;border-radius:99px;overflow:hidden;grid-column:1/-1}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .2s}.counts{font-size:12px;color:var(--muted);grid-column:1/-1}
    .section{margin:18px 0}.section h2{font-size:15px;letter-spacing:.04em;margin:0 0 9px;color:#b9e9e8}.items{display:grid;gap:8px}.task{display:flex;align-items:flex-start;gap:12px;padding:12px 13px;border:1px solid #293d50;border-radius:13px;background:#0c1927;min-height:46px;cursor:pointer}.task:active{transform:scale(.995)}.task input{appearance:none;width:21px;height:21px;flex:none;margin:1px 0 0;border:1.5px solid #6b859b;border-radius:6px;background:#0b1723}.task input:checked{background:var(--accent);border-color:var(--accent);position:relative}.task input:checked:after{content:'✓';color:#062029;font-weight:900;position:absolute;inset:-1px 0 0;text-align:center;font-size:16px}.task span{font-size:14px}.task.done span{color:#8da3b5;text-decoration:line-through;text-decoration-thickness:1px}
    .hint{font-size:12px;color:var(--muted);margin:8px 2px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{border:1px solid #3a6473;background:#153747;color:var(--text);border-radius:12px;padding:12px;font:600 14px system-ui;cursor:pointer}button.secondary{background:#132131;border-color:var(--line)}button:focus-visible,.task:focus-within,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    textarea{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:#0b1825;color:var(--text);padding:12px;font:14px/1.5 system-ui}.foot{margin:18px 2px 0;text-align:center;color:var(--muted);font-size:11px}.saved{display:flex;align-items:center;gap:7px;color:#9bb0c4;font-size:11px;margin-top:12px}.dot{width:7px;height:7px;border-radius:100%;background:var(--good)}
    @media(min-width:620px){.items{grid-template-columns:1fr 1fr}.wrap{padding-top:30px}.panel{padding:20px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="mark" aria-hidden="true">J</div>
    <div><h1>JARVIS DAILY</h1><div class="sub">Panel de control personal</div></div>
    <div class="date" id="dateLabel"></div>
  </header>
  <section class="panel overview" aria-label="Progreso diario">
    <div class="overlabel">Progreso del día</div><div class="percent" id="percent">0%</div>
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="counts" id="counts">0 de 25 tareas completadas</div>
  </section>
  <div id="sections"></div>
  <section class="panel">
    <h2 style="margin:0 0 10px;font-size:15px">Notas para mañana</h2>
    <textarea id="notes" placeholder="Pendientes, ideas u objetivos para mañana..."></textarea>
    <div class="saved"><span class="dot"></span><span>Guardado automáticamente en este móvil</span></div>
    <div class="actions">
      <button id="allBtn">Marcar todo</button>
      <button class="secondary" id="resetBtn">Reiniciar el día</button>
    </div>
  </section>
  <p class="foot">Tus marcas y notas permanecen en este dispositivo. El panel reinicia las casillas al cambiar el día.</p>
</main>
<script>
(function(){
  'use strict';
  const groups=[
    {title:'01 · ESTUDIOS Y OXFORD 3.0',tasks:['Completar los deberes del colegio','OXFORD 3.0: Inglés','OXFORD 3.0: Matemáticas','Repasar lo aprendido y corregir errores','Leer o aprender algo nuevo']},
    {title:'02 · HIGIENE Y CUIDADO PERSONAL',tasks:['Rutina facial de mañana','Cepillarme los dientes por la mañana','Ducharme cuando corresponda','Cuidar y peinar el pelo','Rutina facial de noche','Cepillarme los dientes antes de dormir']},
    {title:'03 · ENTRENAMIENTO Y ACTIVIDAD',tasks:['Completar el entrenamiento previsto (si toca)','Fútbol o actividad deportiva (si toca)','Movilidad suave o paseo, si corresponde','Respetar la recuperación y el descanso']},
    {title:'04 · RESPONSABILIDADES',tasks:['Ordenar mi habitación y escritorio','Preparar mochila y material para mañana','Ayudar en casa']},
    {title:'05 · BIENESTAR Y DESCANSO',tasks:['Beber agua regularmente','Hacer pausas durante el estudio','Dedicar tiempo a familia, amigos o aficiones','Prepararme para dormir a tiempo','Dormir lo suficiente']}
  ];
  const total=groups.reduce((n,g)=>n+g.tasks.length,0), key='jarvisDaily.v1';
  const $=id=>document.getElementById(id);
  function dayKey(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
  function load(){try{const x=JSON.parse(localStorage.getItem(key)||'null');if(x&&x.date===dayKey())return {date:x.date,done:Array.isArray(x.done)?x.done:[],notes:typeof x.notes==='string'?x.notes:''};}catch(e){}return {date:dayKey(),done:[],notes:''};}
  let state=load();
  function save(){state.date=dayKey();try{localStorage.setItem(key,JSON.stringify(state));}catch(e){}}
  function render(){
    const root=$('sections');root.textContent='';
    groups.forEach((group,gi)=>{
      const section=document.createElement('section');section.className='section';
      const heading=document.createElement('h2');heading.textContent=group.title;section.appendChild(heading);
      const items=document.createElement('div');items.className='items';
      group.tasks.forEach((task,ti)=>{
        const id=gi+'-'+ti, label=document.createElement('label');label.className='task'+(state.done.includes(id)?' done':'');
        const input=document.createElement('input');input.type='checkbox';input.checked=state.done.includes(id);input.setAttribute('aria-label',task);
        input.addEventListener('change',()=>{if(input.checked){if(!state.done.includes(id))state.done.push(id);}else{state.done=state.done.filter(x=>x!==id);}save();update();label.classList.toggle('done',input.checked);});
        const span=document.createElement('span');span.textContent=task;label.append(input,span);items.appendChild(label);
      });
      section.appendChild(items);root.appendChild(section);
    });
    $('notes').value=state.notes;update();
  }
  function update(){const n=state.done.length,p=Math.round(n/total*100);$('percent').textContent=p+'%';$('bar').style.width=p+'%';$('counts').textContent=n+' de '+total+' tareas completadas';}
  $('notes').addEventListener('input',()=>{state.notes=$('notes').value;save();});
  $('allBtn').addEventListener('click',()=>{state.done=[];groups.forEach((g,gi)=>g.tasks.forEach((t,ti)=>state.done.push(gi+'-'+ti)));save();render();});
  $('resetBtn').addEventListener('click',()=>{state={date:dayKey(),done:[],notes:''};save();render();});
  function dateCheck(){const today=dayKey();if(state.date!==today){state={date:today,done:[],notes:''};save();render();}}
  $('dateLabel').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'});
  render();window.addEventListener('focus',dateCheck);document.addEventListener('visibilitychange',()=>{if(!document.hidden)dateCheck();});
  if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
})();
</script>
</body>
</html>
